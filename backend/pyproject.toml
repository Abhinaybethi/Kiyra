[project]
name = "backend"
version = "0.1.0"
description = "Local-first AI interview assistance platform (Bonsai + llama.cpp)"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.19.1",
    "chromadb>=1.5.9",
    "fastapi>=0.141.1",
    "faster-whisper>=1.2.1",
    "httpx>=0.28.1",
    "numpy>=2.5.2",
    "pdfminer-six>=20260107",
    "pydantic[email]>=2.13.4",
    "pydantic-settings>=2.15.0",
    "python-docx>=1.2.0",
    "python-multipart>=0.0.32",
    "rapidocr-onnxruntime>=1.4.0",
    "sentence-transformers>=6.0.0",
    "sqlalchemy>=2.0.52",
    "uvicorn[standard]>=0.52.4",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]